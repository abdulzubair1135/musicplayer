name: Keep Render Backend Alive 24/7

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health
        run: |
          curl -s -o /dev/null -w "Render Status: %{http_code}\n" --max-time 60 https://musicplayer-blyl.onrender.com/api/health || true
